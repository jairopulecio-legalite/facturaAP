services:
  facturacion-ap:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:?Configurar SESSION_SECRET en Dokploy}
      USERS_JSON: ${USERS_JSON:?Configurar USERS_JSON en Dokploy}
      DATA_DIR: /app/data
    expose:
      - "3000"
    volumes:
      - facturacion_ap_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  facturacion_ap_data:
